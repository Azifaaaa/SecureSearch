<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SecureSearch Cloud</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="font-size:36px;margin-bottom:8px">🔐</div>
      <h1>Create Account</h1>
      <p>SecureSearch Cloud Registration</p>
    </div>

    <div id="reg-error" class="alert alert-error" style="display:none"></div>
    <div id="reg-success" class="alert alert-success" style="display:none"></div>

    <form id="register-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username" required minlength="3">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Minimum 8 characters" required minlength="8">
      </div>
      <button type="submit" class="btn btn-success" style="width:100%;margin-top:8px" id="reg-btn">
        Create Account
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('reg-btn');
  const errDiv = document.getElementById('reg-error');
  const okDiv = document.getElementById('reg-success');
  btn.disabled = true;
  errDiv.style.display = 'none';
  okDiv.style.display = 'none';

  try {
    const resp = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('reg-username').value,
        email:    document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
      }),
    });
    const data = await resp.json();
    if (resp.ok) {
      okDiv.textContent = 'Account created! Redirecting…';
      okDiv.style.display = 'flex';
      setTimeout(() => window.location.href = '/dashboard', 1200);
    } else {
      errDiv.textContent = data.error || 'Registration failed';
      errDiv.style.display = 'flex';
      btn.disabled = false;
    }
  } catch(err) {
    errDiv.textContent = 'Network error';
    errDiv.style.display = 'flex';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
