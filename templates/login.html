<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SecureSearch Cloud</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="font-size:36px;margin-bottom:8px">🔐</div>
      <h1>SecureSearch Cloud</h1>
      <p>Privacy-Preserving IoT Sensor Search</p>
    </div>

    <div id="login-error" class="alert alert-error" style="display:none"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px" id="login-btn">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)">
      Don't have an account?
      <a href="/register">Register here</a>
    </p>

    <div class="info-panel" style="margin-top:20px">
      <h4>Demo credentials</h4>
      <p>Default account: <strong>admin</strong> / <strong>adminpass123</strong><br>
      Run <code>python scripts/initialize_database.py</code> to create it.</p>
    </div>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errorDiv = document.getElementById('login-error');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errorDiv.style.display = 'none';

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (resp.ok) {
      window.location.href = '/dashboard';
    } else {
      errorDiv.textContent = data.error || 'Login failed';
      errorDiv.style.display = 'flex';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch(err) {
    errorDiv.textContent = 'Network error — is the server running?';
    errorDiv.style.display = 'flex';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
